name: HearStars

options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"

targets:
  HearStarsCore:
    type: framework
    platform: iOS
    sources:
      - path: Sources/HearStarsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.HearStarsCore
        PRODUCT_NAME: HearStarsCore
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES

  HearStars:
    type: application
    platform: iOS
    sources:
      - path: HearStarsApp
        excludes:
          - Resources
      - path: HearStarsApp/Resources
        buildPhase: resources
    dependencies:
      - target: HearStarsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.HearStars
        PRODUCT_NAME: "Hear the Stars"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "$(PRODUCT_NAME)"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Your location is used only on this device to calculate where the selected star is in the sky. It is not stored or sent."
        INFOPLIST_KEY_NSMotionUsageDescription: "Motion sensors compare the direction of your iPhone with the star and pause guidance when movement is detected."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
    scheme:
      testTargets:
        - HearStarsTests
      gatherCoverageData: true

  HearStarsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/HearStarsCoreTests
    dependencies:
      - target: HearStarsCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.HearStarsTests
        GENERATE_INFOPLIST_FILE: YES
